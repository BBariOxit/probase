services:
  postgres:
    image: postgres:17-alpine
    container_name: probase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-probase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-probase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - probase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-probase} -d ${POSTGRES_DB:-probase}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: probase-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - probase-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: probase-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3010}:3001"
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-probase}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-probase}?schema=public
      REDIS_URL: redis://redis:6379
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    networks:
      - probase-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  probase-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

